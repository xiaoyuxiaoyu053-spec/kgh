<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>StarChat</title><link rel="stylesheet" href="/style.css"></head><body>
<div id="auth" class="auth"><div class="card"><div class="logo">★</div><h1>StarChat</h1><p class="muted">公共即时聊天</p><input id="au" placeholder="账号"><input id="ap" type="password" placeholder="密码"><button id="login">登录</button><button id="reg" class="ghost">注册</button><div id="err"></div><small>注册新账号，或使用已有账号登录</small></div></div>
<div id="app" class="hidden"><header><div><b>★ StarChat</b><span id="status">在线</span></div><span id="adminBtn" class="hidden"><button id="adminManage" class="ghost">管理员</button></span><button id="profile">个人资料</button></header>
<main><aside><h3>公共群聊</h3><div id="online"></div><hr><button id="logout" class="ghost">退出登录</button></aside>
<section class="chat"><div id="messages"></div><div id="reply" class="reply hidden"><span id="replyText"></span><button id="cancelReply" class="ghost">取消回复</button></div><div class="composer"><div class="tools"><button id="emoji">😀</button><button id="gif">GIF</button><button id="pickImage">🖼️</button><button id="pickVideo">🎬</button><button id="sound">🔊</button><input id="gifFile" type="file" accept="image/gif" hidden><input id="imageFile" type="file" accept="image/*" hidden><input id="videoFile" type="file" accept="video/*" hidden><span id="hint">点击消息可回复 · 右键/长按可撤回自己的消息</span></div><div class="sendrow"><input id="input" placeholder="输入消息，@某人…"><button id="send">发送</button></div><div id="picker" class="picker hidden">😀 😃 😄 😁 😆 😅 😂 🙂 🙃 😉 😎 😍 🥳 😭 😡 👍 👎 ❤️ 💯 🎉 🔥</div></div></section></main></div>
<div id="modal" class="modal hidden"><div class="card"><h2>个人资料</h2><input id="nick" placeholder="昵称"><input id="avatarFile" type="file" accept="image/*"><button id="save">保存</button><button id="close" class="ghost">关闭</button></div></div><div id="adminModal" class="modal hidden"><div class="card"><h2>管理员设置</h2><div id="adminUsers"></div><button id="adminClose" class="ghost">关闭</button></div></div>
<script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
